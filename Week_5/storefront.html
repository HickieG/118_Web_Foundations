<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="week3styles.css">
    <title>Store Page</title>
</head>
<body>

    <section>
        <h2>Customized Products</h2>
            <ul class="product-list">
                <li class="product-item">
                    <button class="product-button" data-target="laserPlaceholder">LASER-ENGRAVED ITEMS</button>
                    <div id="laserPlaceholder" class="placeholder-box">Product Photo</div>
                </li>
                <li class="product-item">
                    <button class="product-button" data-target="jewelryPlaceholder">HANDCRAFTED JEWELRY</button>
                    <div id="jewelryPlaceholder" class="placeholder-box">Product Photo</div>
                </li>
                <li class="product-item">
                    <button class="product-button" data-target="bobaPlaceholder">BOBA TEA <br>SET</button>
                    <!-- Added a break in the text for "boba tea set" making the button two lines and aligning it with the others -->
                    <div id="bobaPlaceholder" class="placeholder-box">Product Photo</div>
                </li>
                <!-- Each item now pairs its button with its own placeholder box, so alignment stays in sync automatically -->
            </ul>
        <script src="webpagejava.js"></script>
    </section>
</body>

<footer>

</footer>
